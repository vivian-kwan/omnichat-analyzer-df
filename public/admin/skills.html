<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skill Editor — Omnichat Analyzer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    header { background: #1a1a2e; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 18px; font-weight: 600; }
    .badge { background: #e74c3c; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 10px; }
    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }
    .auth-box { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
    .auth-box h2 { font-size: 15px; margin-bottom: 14px; color: #555; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input[type=text], input[type=password] {
      flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px;
    }
    button {
      padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 14px; font-weight: 500; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .btn-primary { background: #1a1a2e; color: #fff; }
    .btn-save { background: #27ae60; color: #fff; }
    .btn-cancel { background: #eee; color: #444; }
    .skill-list { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 24px; }
    .skill-list h2 { font-size: 15px; color: #555; margin-bottom: 14px; }
    .skill-card {
      display: flex; align-items: center; justify-content: space-between;
      padding: 11px 14px; border: 1px solid #e8e8e8; border-radius: 7px; margin-bottom: 8px;
      background: #fafafa; cursor: pointer; transition: background .15s;
    }
    .skill-card:hover { background: #f0f4ff; }
    .skill-card.active { background: #eaf4ff; border-color: #4a90e2; }
    .skill-name { font-weight: 500; font-size: 14px; }
    .skill-hint { font-size: 12px; color: #999; }
    .editor-box { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: none; }
    .editor-box.visible { display: block; }
    .editor-box h2 { font-size: 15px; color: #555; margin-bottom: 12px; }
    textarea {
      width: 100%; height: 420px; padding: 12px; border: 1px solid #ddd;
      border-radius: 7px; font-size: 13px; font-family: 'Menlo', 'Consolas', monospace;
      line-height: 1.55; resize: vertical;
    }
    .editor-actions { margin-top: 12px; display: flex; gap: 10px; }
    .status { font-size: 13px; margin-top: 10px; min-height: 20px; }
    .status.ok { color: #27ae60; }
    .status.err { color: #e74c3c; }
    #authStatus { font-size: 13px; margin-top: 8px; min-height: 18px; }
  </style>
</head>
<body>

<header>
  <h1>Omnichat Analyzer</h1>
  <span class="badge">Skill Editor</span>
  <span style="margin-left:auto; font-size:13px; opacity:.7;" id="userLabel"></span>
</header>

<div class="container">

  <div class="auth-box" id="authBox">
    <h2>Sign in (Senior access required)</h2>
    <div class="row">
      <input type="text" id="serverUrl" placeholder="Server URL  e.g. https://yourserver.com" />
      <input type="text" id="tokenInput" placeholder="Your token" />
      <button class="btn-primary" onclick="login()">Connect</button>
    </div>
    <div id="authStatus"></div>
  </div>

  <div class="skill-list" id="skillListBox" style="display:none">
    <h2>Available Skills</h2>
    <div id="skillCards"></div>
  </div>

  <div class="editor-box" id="editorBox">
    <h2>Editing: <span id="editorTitle"></span></h2>
    <textarea id="editorContent"></textarea>
    <div class="editor-actions">
      <button class="btn-save" onclick="saveSkill()">Save</button>
      <button class="btn-cancel" onclick="closeEditor()">Cancel</button>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>

</div>

<script>
  let BASE_URL = '';
  let TOKEN = '';
  let SECRET = '';
  let currentSkill = '';

  // Allow extension secret to be baked in at deployment time via meta tag or just entered via URL param
  const params = new URLSearchParams(location.search);
  if (params.get('secret')) {
    SECRET = params.get('secret');
  }

  async function apiFetch(path, opts = {}) {
    const headers = {
      'Content-Type': 'application/json',
      'X-Token': TOKEN,
      'X-Extension-Secret': SECRET,
      ...(opts.headers || {})
    };
    const res = await fetch(`${BASE_URL}${path}`, { ...opts, headers });
    return res;
  }

  async function login() {
    const urlInput = document.getElementById('serverUrl').value.trim().replace(/\/$/, '');
    TOKEN = document.getElementById('tokenInput').value.trim();
    const statusEl = document.getElementById('authStatus');

    if (!urlInput || !TOKEN) {
      statusEl.textContent = 'Please enter both server URL and token.';
      statusEl.className = 'err';
      return;
    }

    // Prompt for extension secret if not in URL params
    if (!SECRET) {
      SECRET = prompt('Enter extension secret (ask your admin):') || '';
    }

    BASE_URL = urlInput;
    statusEl.textContent = 'Connecting…';
    statusEl.className = '';

    try {
      const res = await apiFetch('/api/skills');
      if (res.status === 403) {
        statusEl.textContent = 'Access denied — senior role required.';
        statusEl.className = 'err';
        return;
      }
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        statusEl.textContent = d.error || `Error ${res.status}`;
        statusEl.className = 'err';
        return;
      }
      const data = await res.json();
      statusEl.textContent = '';
      document.getElementById('authBox').style.display = 'none';
      document.getElementById('skillListBox').style.display = 'block';
      document.getElementById('userLabel').textContent = `Connected to ${BASE_URL}`;
      renderSkills(data.skills);
    } catch (e) {
      statusEl.textContent = 'Could not reach server. Check URL and try again.';
      statusEl.className = 'err';
    }
  }

  function renderSkills(skills) {
    const container = document.getElementById('skillCards');
    container.innerHTML = '';
    skills.forEach(name => {
      const card = document.createElement('div');
      card.className = 'skill-card';
      card.dataset.name = name;
      card.innerHTML = `<span class="skill-name">${name}</span><span class="skill-hint">Click to edit</span>`;
      card.onclick = () => openSkill(name);
      container.appendChild(card);
    });
  }

  async function openSkill(name) {
    currentSkill = name;
    document.querySelectorAll('.skill-card').forEach(c => c.classList.toggle('active', c.dataset.name === name));
    const res = await apiFetch(`/api/skills/${name}`);
    const data = await res.json();
    document.getElementById('editorTitle').textContent = name;
    document.getElementById('editorContent').value = data.content || '';
    document.getElementById('saveStatus').textContent = '';
    document.getElementById('editorBox').classList.add('visible');
  }

  async function saveSkill() {
    const content = document.getElementById('editorContent').value;
    const statusEl = document.getElementById('saveStatus');
    statusEl.textContent = 'Saving…';
    statusEl.className = 'status';
    try {
      const res = await apiFetch(`/api/skills/${currentSkill}`, {
        method: 'PUT',
        body: JSON.stringify({ content })
      });
      const data = await res.json();
      if (data.success) {
        statusEl.textContent = '✓ Saved successfully.';
        statusEl.className = 'status ok';
      } else {
        statusEl.textContent = data.error || 'Save failed.';
        statusEl.className = 'status err';
      }
    } catch (e) {
      statusEl.textContent = 'Network error.';
      statusEl.className = 'status err';
    }
  }

  function closeEditor() {
    document.getElementById('editorBox').classList.remove('visible');
    document.querySelectorAll('.skill-card').forEach(c => c.classList.remove('active'));
    currentSkill = '';
  }
</script>

</body>
</html>
